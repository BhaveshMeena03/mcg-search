name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-env ruff
      - run: ruff check .
      # No API keys here on purpose. Every test in the suite runs offline;
      # anything that needs a real key belongs in scripts/, not tests/.
      - run: pytest -q
